<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TED Procurement Notifier</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .box { padding: 20px; border: 1px solid #ccc; width: 400px; border-radius: 8px; }
        select, button { padding: 8px; margin-top: 10px; width: 100%; }
        pre { background: #f4f4f4; padding: 10px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Lọc Gói Thầu TED theo Địa Điểm</h2>
        <label for="country">Chọn quốc gia (Mã ISO):</label>
        <select id="country">
            <option value="DEU">Đức (DEU)</option>
            <option value="FRA">Pháp (FRA)</option>
            <option value="ITA">Ý (ITA)</option>
            <option value="ESP">Tây Ban Nha (ESP)</option>
        </select>

        <button onclick="fetchData()">Tải dữ liệu</button>
        
        <h3>Trạng thái:</h3>
        <p id="status">Chưa chạy</p>
        <pre id="log"></pre>
    </div>

    <script>
        async function fetchData() {
            const country = document.getElementById("country").value;
            const statusEl = document.getElementById("status");
            const logEl = document.getElementById("log");

            statusEl.innerText = "Đang kết nối tới TED API và tải dữ liệu...";
            logEl.innerText = "";

            const response = await fetch("/run-export", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ location: country, max: 10 })
            });

            const result = await response.json();
            if (response.ok) {
                statusEl.innerText = result.message;
                logEl.innerText = result.output;
            } else {
                statusEl.innerText = "Lỗi: " + result.message;
                logEl.innerText = result.error;
            }
        }
    </script>
</body>
</html>
